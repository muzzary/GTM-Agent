[project]
name = "gtm-agent"
version = "0.1.0"
description = "Reusable, evidence-backed GTM outreach agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.9.1",
    "pydantic>=2.13.4",
    "rapidfuzz==3.14.5",
    "tldextract==5.3.1",
    "trafilatura==2.2.0",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
